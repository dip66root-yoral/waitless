services:
  - type: web
    name: waitless-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.18.1"
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://waitless-ui.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: waitless-ui
    env: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://waitless-api-tv0e.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: VITE_API_URL
        value: ""
      - key: VITE_WS_URL
        value: https://waitless-api-tv0e.onrender.com
